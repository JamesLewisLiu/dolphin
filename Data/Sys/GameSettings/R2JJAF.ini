# R2JJAF - Taiko no Tatsujin Wii (Japan)
#
# The player-entry screen reuses texture memory for the Mii and save-data
# icons.  The game rewrites the source texture without a TMEM invalidate.
# Use complete texture hashes and let the cache recheck them instead of
# trusting the TMEM residency heuristic.

[Video_Settings]
SafeTextureCacheColorSamples = 0
